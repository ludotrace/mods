name: release

# Triggered by `make release` (which tags from VERSION and pushes the tag).
# Builds cross-platform lt-validate binaries with the version stamped in and
# attaches them to a GitHub Release, so mod authors download one file and run it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v0.2.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: tag matches VERSION file
        run: |
          FILE_VERSION="$(cat VERSION)"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "VERSION file ($FILE_VERSION) does not match tag ($VERSION)" >&2
            exit 1
          fi

      - name: sanity-check the build
        run: make test

      - name: build cross-platform binaries
        run: |
          mkdir -p dist
          LDFLAGS="-X main.version=$VERSION"
          for target in \
            "linux amd64 lt-validate-linux-amd64" \
            "darwin amd64 lt-validate-macos-amd64" \
            "darwin arm64 lt-validate-macos-arm64" \
            "windows amd64 lt-validate-windows-amd64.exe"; do
            set -- $target
            echo "building $3"
            GOOS=$1 GOARCH=$2 go build -ldflags "$LDFLAGS" -o "dist/$3" .
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
